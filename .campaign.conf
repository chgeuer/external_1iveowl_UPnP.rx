# Repository-specific settings for campaign.sh.
CAMPAIGN_NAME="upnp-audit-2026-07"
CAMPAIGN_PROJECTS=(upnp)
CAMPAIGN_LABELS=(audit-2026-07)
CAMPAIGN_GUARDRAILS="Claim only issues labeled afk; never claim hitl work without a recorded human decision. Change code only under upnp/, and never touch samples/upnp_explorer. Every fix must make untrusted SSDP, HTTP, and GENA input incapable of raising or of allocating without bound; never restore an unbounded timer, an unbounded collection, or a raising parser to make a run pass. Preserve OTP ownership and graceful-versus-abrupt lifecycle semantics, tagged protocol errors, pure lenient parsers, the single injected UPnP.Clock, and hermetic tests with no real multicast. Never weaken a gate, bound, or acceptance criterion to make a run pass."

# Start every item with Sol. Only the explicit provider cybersecurity refusal
# resumes that same session with Opus; all other failures remain human-visible.
# Security-flavoured issues in this campaign (crash-on-hostile-input, spoofing,
# resource exhaustion) make that refusal path more likely than usual, so keep
# the fallback enabled.
COPILOT_MODEL="${COPILOT_MODEL:-gpt-5.6-sol}"
COPILOT_EFFORT="${COPILOT_EFFORT:-max}"
COPILOT_FALLBACK_MODEL="${COPILOT_FALLBACK_MODEL-claude-opus-5}"
COPILOT_FALLBACK_EFFORT="${COPILOT_FALLBACK_EFFORT:-max}"

# ---- env knobs (override these defaults on the command line) -----------------
#   MAX_ITERS=30          # stop after N issues this invocation
#   RUN_TIMEOUT=1800      # per-run wall-clock seconds before the run is killed
#   COPILOT_MODEL=...     # primary model for each new issue
#   COPILOT_EFFORT=...    # primary reasoning effort
#   COPILOT_FALLBACK_MODEL=...   # exact-refusal fallback; empty disables it
#   COPILOT_FALLBACK_EFFORT=...  # fallback reasoning effort
#   CAMPAIGN_REPO=/path   # override repo root (default: git toplevel)
