name: CI

on:
  push:
    branches: [main, 'releases/**']
    tags: ['v*']
  pull_request:

jobs:
  elixir-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upnp
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '28'

      - name: Restore Elixir dependencies
        run: mix deps.get

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Compile Elixir without warnings
        run: mix compile --force --warnings-as-errors

      - name: Test Elixir with coverage
        run: mix test --cover

      - name: Build Elixir documentation
        run: mix docs --warnings-as-errors

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UPnP.Rx.slnx

      - name: Build
        run: dotnet build UPnP.Rx.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test tests/UPnP.Rx.Tests/UPnP.Rx.Tests.csproj --no-build -c Release

      - name: Pack
        run: dotnet pack src/UPnP.Rx/UPnP.Rx.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      # Required for NuGet Trusted Publishing: the job exchanges the GitHub OIDC
      # token for a short-lived nuget.org API key — no stored secrets.
      id-token: write
      # Required to create the GitHub release for the tag.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Requires a Trusted Publishing policy on nuget.org (profile → Trusted
      # Publishing) for repository 1iveowl/UPnP.rx, workflow ci.yml.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1iveowl

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Only after the package is out, so a failed push leaves no release
      # claiming otherwise. Attaches the packages and generates notes from the
      # commit history since the previous tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*.nupkg
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
